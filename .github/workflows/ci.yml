name: CI - Backend Tests

# Pipeline startet bei jedem Push und bei Pull Requests auf main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Alle Befehle laufen im Backend-Unterordner
    defaults:
      run:
        working-directory: 07_cicd-pipeline/recipe-planner/recipe-planner-backend

    steps:
      # 1. Code aus dem Repo holen
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 installieren (wie lokal)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Tests ausfuehren (erzeugt automatisch JaCoCo-Report)
      - name: Run tests with Maven
        run: mvn clean test

      # 4. Surefire-HTML-Report erzeugen
      - name: Generate Surefire report
        run: mvn surefire-report:report-only

      # 5. Reports als herunterladbare Artifacts hochladen
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            07_cicd-pipeline/recipe-planner/recipe-planner-backend/target/site/
            07_cicd-pipeline/recipe-planner/recipe-planner-backend/target/surefire-reports/